			gate reads context.no_cache, which the_reezort/www/resort_app.py's
			get_context() must actually be invoked to set; see that fix too).

			readCsrfToken() in the API clients reads window.frappe.csrf_token.
		-->
		<script>
			// add_csrf_token() emits `frappe.csrf_token = "...";` assuming a
			// global `frappe` already exists (true on Frappe's desk/website
			// base templates, which load frappe-web.bundle.js first) — this
			// SPA's HTML never loads that bundle, so the assignment threw
			// ReferenceError: frappe is not defined and window.frappe was
			// silently never created (readCsrfToken()'s fallback chain then
			// resolved to "", 403ing every write endpoint). Pre-declare it.
			window.frappe = window.frappe || {};
		</script>
